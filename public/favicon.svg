<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#357ab8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Sun -->
  <circle cx="25" cy="25" r="11" fill="url(#sunGrad)" filter="url(#shadow)"/>
  <g stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="25" y1="9" x2="25" y2="12"/>
    <line x1="25" y1="38" x2="25" y2="41"/>
    <line x1="9" y1="25" x2="12" y2="25"/>
    <line x1="38" y1="25" x2="41" y2="25"/>
    <line x1="13.7" y1="13.7" x2="15.8" y2="15.8"/>
    <line x1="34.2" y1="34.2" x2="36.3" y2="36.3"/>
    <line x1="13.7" y1="36.3" x2="15.8" y2="34.2"/>
    <line x1="34.2" y1="15.8" x2="36.3" y2="13.7"/>
  </g>

  <!-- Cloud -->
  <path d="M 22 47 
           L 46 47 
           A 8 8 0 0 0 46 31 
           A 7.5 7.5 0 0 0 38 27.5 
           A 12 12 0 0 0 21.5 33 
           A 7 7 0 0 0 22 47 Z" 
        fill="url(#cloudGrad)" 
        filter="url(#shadow)"/>
</svg>
